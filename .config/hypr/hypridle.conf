# Hypridle → MacLock.
#
# Idle locking goes through the same IPC wrapper the SUPER+L keybind uses
# (lock-via-ipc.sh), so there is exactly one locker: double-locks are serialized
# by the wrapper's flock, a lost lock is recovered, and MacLock never quits
# while still holding the session. No hyprlock fallback here — MacLock
# replaced hyprlock entirely.
#
# hypridle is started by hyprland.lua's autostart block.
general {
    # suspend: lock first, then sleep (the wrapper exits only after the session is locked)
    before_sleep_cmd = ~/.config/quickshell/MacLock/lock-via-ipc.sh
    ignore_dbus_inhibit = false    # respect video players ("don't lock while watching")
    ignore_systemd_inhibit = false
}

# 15 minutes idle → lock
listener {
    timeout = 900
    on-timeout = ~/.config/quickshell/MacLock/lock-via-ipc.sh
}
