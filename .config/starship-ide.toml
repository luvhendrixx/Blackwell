"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = "[ 󰀵 ](bold white)$character"
right_format = "$git_branch$git_status$git_metrics"

[character]
success_symbol = "[~ >](bold green)"
error_symbol = "[~ >](bold red)"

[git_branch]
symbol = " "
style = "bold white"
format = "[$symbol$branch]($style) "

[git_status]
style = "white"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = '([+$added]($added_style)/[-$deleted]($deleted_style) )'
