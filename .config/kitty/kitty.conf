font_family JetBrainsMono Nerd Font
font_size 10
confirm_os_window_close 0

shell_integration enabled

include matugen.conf

cursor_shape block
cursor_blink_interval 0

background_opacity 0.55
background_blur    1

window_padding_width 8 10

# Input speed vs battery
repaint_delay 8        
input_delay 2          
sync_to_monitor yes   

# Memory
scrollback_lines 10000 

# Small quality of life
enable_audio_bell no
copy_on_select clipboard
mouse_hide_wait 3.0

# Ctrl+L wipes the scrollback too, then the shell redraws the prompt
map ctrl+l combine : clear_terminal scrollback active : send_text normal,application \x0c

remember_window_size  no
# initial_window_width  800
# initial_window_height 600
