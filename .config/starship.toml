"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

command_timeout = 500   # don't let slow git calls hang the prompt
scan_timeout = 30

# Top line: git, pushed to the far right. Bottom line: apple logo + arrow
format = """
$fill$git_state$git_branch$git_status$git_metrics
[ 󰀵 ](bold white)$character"""

# Far right of the prompt line: duration, jobs, languages, directory
right_format = """
$cmd_duration$jobs\
$haskell$c$cpp$odin$python$rust$golang$nodejs${custom.react}\
 $directory"""

[fill]
symbol = " "

[character]
success_symbol = "[~ >](bold green)"
error_symbol = "[~ >](bold red)"

[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style)"

# ---------- Productivity ----------
[cmd_duration]
min_time = 2000
format = "[󰔟 $duration ]($style)"
style = "dimmed white"

[jobs]
symbol = "✦"
number_threshold = 1
format = "[$symbol$number ]($style)"
style = "bold yellow"

# ---------- Git ----------
[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold yellow"

[git_branch]
symbol = " "
style = "bold white"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style))'

# ---------- Languages (icon only, dimmed so git/dir stand out) ----------
[haskell]
symbol = "λ "
style = "dimmed white"
format = "[$symbol]($style)"

[c]
symbol = " "
style = "dimmed white"
format = "[$symbol]($style)"

[cpp]
disabled = false
symbol = " "
style = "dimmed white"
format = "[$symbol]($style)"

[odin]
symbol = "Ø "
style = "dimmed white"
format = "[$symbol]($style)"

[python]
symbol = "🐍 "
style = "dimmed white"
format = "[$symbol]($style)"

[rust]
symbol = "🦀 "
style = "dimmed white"
format = "[$symbol]($style)"

[golang]
symbol = "🐹 "
style = "dimmed white"
format = "[$symbol]($style)"

[nodejs]
symbol = " "
style = "dimmed white"
format = "[$symbol]($style)"

[custom.react]
when = "grep -q '\"react\"' package.json 2>/dev/null"
command = "echo ⚛️"
format = "[$output ]($style)"
style = "dimmed white"
