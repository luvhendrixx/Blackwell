# Limine bootloader — macOS-style interface
# Wallpaper + interface colours (Limine >= 12 dropped the classic theme files)
timeout: 5
default_entry: 1
remember_last_entry: yes

interface_branding: ARCH
interface_branding_colour: e8e2d5
interface_help_hidden: yes
interface_help_colour: 8ab4f8
interface_help_colour_bright: a5c8ff

wallpaper: boot():/EFI/BOOT/wallpaper.jpg
wallpaper_style: stretched
backdrop: 0a0e1c

quiet: yes
verbose: no

/Arch Linux (linux-zen)
    protocol: efi
    path: boot():/EFI/Linux/arch-linux-zen.efi
    cmdline: root=PARTUUID=99e11950-d72a-4412-8212-a784d596b3c1 zswap.enabled=0 rootflags=subvol=@ rw rootfstype=btrfs quiet splash