# Limine bootloader — macOS-style interface
# Wallpaper + interface colours (Limine >= 12 dropped the classic theme files)
timeout: 5
default_entry: 1
remember_last_entry: yes

# start of customization (aesthetic) bit
# Branding is a single "." coloured like the wallpaper's dark sky, so it is
# effectively invisible (an empty value makes Limine show its default title).
interface_branding: .
interface_branding_colour: 0d0f17
interface_help_hidden: yes
interface_help_colour: 8e8e93
interface_help_colour_bright: c7c7cc

wallpaper: boot():/EFI/BOOT/wallpaper.jpg
wallpaper_style: centered
backdrop: 1c1c1e

term_background: b01c1c1e
term_foreground: e5e5ea
term_background_bright: 2c2c2e
term_foreground_bright: f2f2f7
term_palette: e5e5ea;8e8e93;a1a1a6;b0b0b5;c7c7cc;d1d1d6;e5e5ea;48484a
term_palette_bright: 48484a;8e8e93;a1a1a6;b0b0b5;c7c7cc;d1d1d6;e5e5ea;ffffff
term_margin: 40
term_margin_gradient: 20
# end of customization (aesthetic) bit

# "yes" hides the boot menu (the countdown still runs), so keep this "no".
quiet: no
# "no" hides the [ ok ] boot messages.
verbose: no

# ── Porting to another machine ──────────────────────────────────────────────
# 1. root=UUID=  -> run:  findmnt -no UUID /
# 2. path=       -> your kernel EFI (default: boot():/EFI/Linux/<kernel>.efi)
# 3. Kernel entry name/cmdline flags (zswap, subvol, splash) are free to tweak.
#    Keep  rootflags=subvol=@  if your root subvolume is named "@".
# UUID identifies the filesystem, so this survives disk swaps; PARTUUID would not.

# Boot entries are generated automatically by limine-entry-tool
# (yay -S limine-mkinitcpio-hook-git). It keeps them under /+Arch Linux
# and preserves every non-entry line above, including the wallpaper.
